<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terrain Hero</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --canvas-bg:            #121314;
      --card-bg:              #241E14;
      --card-border:          rgba(245,240,235,0.15);
      --color-text-body:      rgba(245,240,235,0.88);
      --color-text-muted:     rgba(245,240,235,0.75);
      --accent:               #0047FF;
      --input-border-default: rgba(245,240,235,0.45);
      --input-border-focus:   #0047FF;
      --caret-color:          #0047FF;
    }

    html, body {
      height: 100%;
    }

    body {
      background: linear-gradient(to top, #0D0B09 0%, #181008 45%, #261A0A 100%);
      min-height: 100vh;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--color-text-body);
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 8vw, 8rem);
    }

    .hero__inner {
      max-width: 780px;
      width: 100%;
    }

    .hero__eyebrow {
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
    }

    .hero__heading {
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--color-text-body);
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
    }

    .hero__heading em {
      font-style: italic;
      background: linear-gradient(to right, #0033CC 0%, #0047FF 50%, #4D80FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero__sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(0.95rem, 1.8vw, 1.15rem);
      font-weight: 400;
      line-height: 1.65;
      color: var(--color-text-muted);
      max-width: 520px;
      margin-bottom: clamp(2rem, 5vw, 3.5rem);
    }

    .hero__cta {
      display: inline-block;
      background: var(--accent);
      color: var(--color-text-body);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(0.85rem, 1.2vw, 0.95rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      transition: filter 0.2s ease, box-shadow 0.25s ease, transform 0.2s ease;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 12px rgba(0, 71, 255, 0.22);
    }

    .hero__cta:hover {
      filter: brightness(1.15);
      box-shadow: 0 4px 20px rgba(0, 71, 255, 0.38);
      transform: translateY(-1px);
    }

    .hero__cta:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(0, 71, 255, 0.22);
    }

    /* Subtle grain texture overlay */
    .hero::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.4;
      z-index: 0;
    }

    .hero__inner {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__inner">
      <span class="hero__eyebrow">Trades · Careers · Real life</span>
      <h1 class="hero__heading">See the whole <em>terrain.</em></h1>
      <p class="hero__sub">
        Before you choose a trade, understand the work, the money, the path,
        and the life it becomes.
      </p>
      <a href="#" class="hero__cta">Start exploring</a>
    </div>
  </section>
</body>
</html>
